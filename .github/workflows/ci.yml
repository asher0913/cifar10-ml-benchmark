name: Core tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy scikit-learn
      - run: python -m compileall -q main.py src tests
      - run: python -m unittest discover -s tests -v
